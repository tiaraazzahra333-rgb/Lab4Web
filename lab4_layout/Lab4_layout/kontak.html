
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Layout Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">

        <header>
            <h1>Layout Sederhana</h1>
        </header>

        <nav>
            <a href="home.html">Home</a>
            <a href="home.html#artikel">Artikel</a>
            <a href="about.html">About</a>
            <a href="kontak.html" class="active">Kontak</a>
        </nav>

        <section id="hero">
            <h1>Contact Me</h1>
            <p>
                Silakan isi formulir berikut untuk menyampaikan
                pertanyaan, saran, atau pesan.
            </p>
        </section>

        <section class="page-content">
            <h2>Formulir Kontak</h2>

            <form class="contact-form"
                  action="#"
                  method="post"
                  onsubmit="alert('Formulir berhasil diuji. Data belum dikirim ke server.'); return false;">

                <label for="nama">Nama Lengkap</label>
                <input type="text"
                       id="nama"
                       name="nama"
                       placeholder="Masukkan nama lengkap"
                       required>

                <label for="email">Email</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="nama@email.com"
                       required>

                <label for="subjek">Subjek</label>
                <input type="text"
                       id="subjek"
                       name="subjek"
                       placeholder="Masukkan subjek pesan"
                       required>

                <label for="message">Message</label>
                <textarea id="message"
                          name="message"
                          placeholder="Tuliskan pesan kamu..."
                          required></textarea>

                <button type="submit">Kirim Pesan</button>
            </form>
        </section>

        <footer>
            <p>&copy; 2026 - Praktikum Pemrograman Web</p>
        </footer>

    </div>
</body>
</html>
